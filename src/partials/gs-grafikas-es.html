<div class="nectar-global-section" data-gs="GS-Grafikas Ispanija" data-location="inline" data-salient="Global Section „GS-Grafikas Ispanija“ (Global Section element) · typed monthly">
  <div class="wpb_row sgp-grafikas" data-type="full_width_content" data-salient="Row → Type: Full Width Content · Padding 0 · Extra Class sgp-grafikas (C-5)">
    <div class="row_col_wrap_12">
      <div class="wpb_column vc_col-sm-12" data-el-space="none" data-salient="Column → Column Element Spacing: None">
        <div class="vc_column-inner">
          <span class="nectar-badge" data-badge-style="line" data-salient="Badge → Minimal Line · Label">Iš Lietuvos</span>
{{grafikas:rows|routes=lt-es|tone={{param:tone=P}}}}
          <span class="nectar-badge" data-badge-style="line" style="--mt:34px" data-salient="Badge → Minimal Line · Label">Į Lietuvą</span>
{{grafikas:rows|routes=es-lt|tone={{param:tone=P}}}}
          <p class="nectar-responsive-text" data-inherit="small" style="--fg:var(--tone-muted);--mt:22px" data-salient="Responsive Text → small">{{grafikas:note}}</p>
          <span class="nectar-badge" data-badge-style="line" style="--fg:var(--tone-muted);--mt:12px" data-salient="Badge → Minimal Line · Label · typed date">{{grafikas:updated}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
