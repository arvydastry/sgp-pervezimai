<div class="sgp-board" data-salient="Inner Row (Backdrop filter blur 16px, bg rgba(11,14,16,.74)) · Global Section GS-Board · [sgp_grafikas variant=&quot;board&quot;] · flap = .sgp-flap (desktop, once)">
  <div class="sgp-wrap sgp-wrap--zone">
    <div class="sgp-board__head">
      <span class="sgp-board__origin" aria-hidden="true"><span class="sgp-ring sgp-ring--fill"></span></span>
      <h2 class="sgp-board__title">Artimiausi pervežimai</h2>
      <p class="sgp-board__note">{{grafikas:note}}</p>
      <a class="sgp-lnk" href="{{url:grafikas}}">Visas grafikas<svg class="sgp-i" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
    {{grafikas:board}}
  </div>
</div>
